<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fixture: the explorers' back-link bar, as shipped</title>
<!-- Frozen from the three explorers, which carried this block byte-identically
     until each was ported. The first <style> is the page reset the homotopy and
     realization explorers share, which the bar's box depends on (border-box
     sizing). The ambiguity page is different: it overrides the bar to full
     bleed (max-width:none; padding:0 0 12px) inside a padded body, a variant
     that arrives with its de-iframing port. tests/shell.test.mjs holds .uf-nav
     to this, and checks that any explorer still carrying the block carries
     exactly this one. -->
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0}</style>
<style id="unfold-navigation-style">.unfold-navigation{max-width:1100px;margin:0 auto;padding:14px 24px 0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.unfold-navigation a{color:light-dark(#626873,#a8adb6);text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:3px 0}.unfold-navigation a:hover{color:light-dark(#386acf,#96b5ff)}.unfold-navigation a:focus-visible{outline:2px solid light-dark(#386acf,#96b5ff);outline-offset:4px;border-radius:2px}@media(max-width:600px){.unfold-navigation{padding:12px 12px 0}}</style>
</head>
<body>
<nav class="unfold-navigation" aria-label="Back to all explorers"><a href="index.html"><span aria-hidden="true">←</span> Unfold</a></nav>
</body>
</html>
