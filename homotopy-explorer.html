<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="See the starting, current, and final maps of a homotopy, with matching colors for corresponding points.">
<meta name="color-scheme" content="light dark">
<title>Homotopy explorer · Unfold</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 22Q16 0 28 22' fill='none' stroke='%234b7bec' stroke-width='4'/%3E%3Ccircle cx='16' cy='11' r='4' fill='%23ef8354'/%3E%3C/svg%3E">
<link rel="stylesheet" href="engine/unfold.css">
<link rel="stylesheet" href="pages/homotopy.css">
</head>
<body>
<nav class="uf-nav" aria-label="Back to all explorers"><a href="index.html"><span aria-hidden="true">←</span> Unfold</a></nav>
<main class="uf-shell" data-palette="homotopy">

<div class="uf-toolbar"><h1>Homotopy explorer</h1><div class="uf-picker" id="choose"></div></div>

<!-- Widget one. The engine builds everything inside: the controls, the two
     columns, the four drawings, the connector overlay and the prose, in the
     order the spec's `body` lists them. -->
<section id="homotopy"></section>

<!-- Widget two. Five pictures on a commutative square with the maps written
     in the gutters, which is a drawing rather than a layout: the page writes
     the grid and panels.custom() adopts it. Everything else — the controls,
     the notes, the status line — the engine still builds, and appends around
     this block in `body` order. -->
<section id="equivalence" hidden>
  <div id="eq-spaces" class="eq-spaces">
    <svg class="uf-overlay" data-uf="overlay" aria-hidden="true"></svg>
    <p class="uf-space-label eq-axis-x" data-uf="label:x"></p>
    <p class="uf-space-label eq-axis-y" data-uf="label:y"></p>
    <figure class="uf-frame" data-cell="source"><h2><span class="uf-frame__title" data-uf="title"></span></h2><svg class="uf-drawing" data-panel="source"></svg></figure>
    <div class="eq-leg eq-leg-top"><span id="eq-top-map">f</span><span id="eq-top-arrow" aria-hidden="true">→</span></div>
    <figure class="uf-frame" data-cell="middle"><h2><span class="uf-frame__title" data-uf="title"></span></h2><svg class="uf-drawing" data-panel="middle"></svg></figure>
    <figure class="uf-frame uf-frame--current" data-cell="now"><h2><span class="uf-frame__title" data-uf="title"></span></h2><svg class="uf-drawing" data-panel="now"></svg></figure>
    <div class="eq-copy-arrow"><span aria-hidden="true">↓</span><span>same point</span></div>
    <figure class="uf-frame" data-cell="compose"><h2><span class="uf-frame__title" data-uf="title"></span></h2><svg class="uf-drawing" data-panel="compose"></svg></figure>
    <div class="eq-leg eq-leg-bottom"><span id="eq-bottom-map">g</span><span id="eq-bottom-arrow" aria-hidden="true">←</span></div>
    <figure class="uf-frame" data-cell="copy"><h2><span class="uf-frame__title" data-uf="title"></span></h2><svg class="uf-drawing" data-panel="copy"></svg></figure>
  </div>
</section>

</main>
<script type="module">
import { start } from './pages/homotopy.js';
start();
</script>
</body>
</html>
