<div id="forest-morse-lesson">
  <h3>A rooted tree and its Morse arrows</h3>
  <div class="viz-row"><button class="btn" type="button" data-mode="tree" aria-pressed="true">Two pairs: tree</button><button class="btn" type="button" data-mode="cycle" aria-pressed="false">Three pairs: cycle</button><button class="btn" type="button" id="fm-step">Follow one arrow</button></div>
  <div class="fm-panels"><div><div class="text-small">Original graph</div><svg class="fm-original" role="img" aria-label="Triangle graph with arrows on the selected edges"></svg></div><div><div class="text-small">Faces and their incidences</div><svg class="fm-incidence" role="img" aria-label="Vertex-edge incidences: matched arrows point from a vertex to an edge"></svg></div></div>
  <div class="text-small" id="fm-status" aria-live="polite"></div>
</div>
<style>
#forest-morse-lesson .fm-panels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:16px 0 8px;}
#forest-morse-lesson svg{display:block;width:100%;height:255px;}
#forest-morse-lesson svg text{fill:var(--foreground);font-size:var(--font-size-base);}
@media(max-width:530px){#forest-morse-lesson .fm-panels{grid-template-columns:1fr;}}
</style>
<script>
(() => {
  const root=document.getElementById('forest-morse-lesson');
  const original=root.querySelector('.fm-original'), incidence=root.querySelector('.fm-incidence');
  const status=root.querySelector('#fm-status'), stepButton=root.querySelector('#fm-step');
  const ns='http://www.w3.org/2000/svg';
  let mode='tree',step=0;
  const sequence=['a','ab','b','bc','c','ca','a'];
  function restore(s){const saved=s?.modelContent?.morseExample;if(saved==='tree'||saved==='cycle')mode=saved;const n=s?.privateContent?.step;if(Number.isInteger(n))step=Math.max(0,Math.min(mode==='tree'?4:6,n));}
  function save(){window.openai?.setWidgetState({modelContent:{morseExample:mode},privateContent:{step}}).catch(()=>{});}
  const add=(svg,tag,attrs,text)=>{const el=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,v);if(text!==undefined)el.textContent=text;svg.appendChild(el);return el;};
  function defs(svg,id){const d=add(svg,'defs',{});for(const [suffix,col]of [['m','var(--viz-series-1)'],['n','var(--muted-foreground)']]){const m=document.createElementNS(ns,'marker');for(const[k,v]of Object.entries({id:id+suffix,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:5,markerHeight:5,orient:'auto-start-reverse'}))m.setAttribute(k,v);const p=document.createElementNS(ns,'path');p.setAttribute('d','M 0 0 L 10 5 L 0 10 z');p.setAttribute('fill',col);m.appendChild(p);d.appendChild(m);}}
  function arrow(svg,a,b,matched,id){const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy),pad=23;add(svg,'line',{x1:a[0]+dx/d*pad,y1:a[1]+dy/d*pad,x2:b[0]-dx/d*pad,y2:b[1]-dy/d*pad,stroke:matched?'var(--viz-series-1)':'var(--muted-foreground)','stroke-width':matched?3:1.4,'marker-end':`url(#${id}${matched?'m':'n'})`});}
  function node(svg,key,p,edge,active){if(active)add(svg,'circle',{cx:p[0],cy:p[1],r:26,fill:'var(--viz-series-2)','fill-opacity':0.2});add(svg,edge?'rect':'circle',edge?{x:p[0]-21,y:p[1]-16,width:42,height:32,rx:5,fill:'var(--background)',stroke:'var(--foreground)','stroke-width':1.2}:{cx:p[0],cy:p[1],r:17,fill:'var(--background)',stroke:'var(--foreground)','stroke-width':1.2});add(svg,'text',{x:p[0],y:p[1],'text-anchor':'middle','dominant-baseline':'central'},key);}
  function draw(){
    root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
    const active=sequence[step], w=original.clientWidth||300;
    original.setAttribute('viewBox',`0 0 ${w} 255`);original.replaceChildren();defs(original,'fmo-');
    const p={a:[w/2,32],b:[w-45,190],c:[45,190]};
    for(const [a,b]of [['a','b'],['b','c']])arrow(original,p[a],p[b],true,'fmo-');
    if(mode==='cycle')arrow(original,p.c,p.a,true,'fmo-');else add(original,'line',{x1:p.a[0],y1:p.a[1],x2:p.c[0],y2:p.c[1],stroke:'var(--border)','stroke-width':1.5});
    for(const v of ['a','b','c'])node(original,v,p[v],false,v===active);
    if(mode==='tree'){add(original,'text',{x:p.c[0],y:225,'text-anchor':'middle'},'root');add(original,'text',{x:(p.c[0]+p.a[0])/2-18,y:102,'text-anchor':'end'},'ca');}
    const iw=incidence.clientWidth||300;
    incidence.setAttribute('viewBox',`0 0 ${iw} 255`);incidence.replaceChildren();defs(incidence,'fmi-');
    const q={a:[iw/2,28],ab:[iw-35,72],b:[iw-35,173],bc:[iw/2,223],c:[35,173],ca:[35,72]};
    const matched=new Set(mode==='tree'?['a:ab','b:bc']:['a:ab','b:bc','c:ca']);
    for(const[e,vs]of Object.entries({ab:['a','b'],bc:['b','c'],ca:['c','a']}))for(const v of vs){const m=matched.has(v+':'+e);arrow(incidence,m?q[v]:q[e],m?q[e]:q[v],m,'fmi-');}
    for(const [key,point]of Object.entries(q))node(incidence,key,point,key.length===2,key===active);
    const trail=sequence.slice(0,step+1).join(' → ');
    status.textContent=mode==='tree'?`${trail}${step===4?' · stopped at root c':' · two matched pairs; no cycle'}`:`${trail}${step===6?' · returned to a: directed cycle':' · three matched pairs; cyclic'}`;
    stepButton.disabled=mode==='tree'&&step===4;
    root.dataset.mode=mode;root.dataset.step=String(step);
  }
  restore(window.openai?.widgetState);
  root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;step=0;draw();save();}));
  stepButton.addEventListener('click',()=>{step=mode==='cycle'?(step+1)%7:Math.min(4,step+1);draw();save();});
  window.addEventListener('openai:set_globals',e=>{restore(e.detail?.globals?.widgetState);draw();});
  new ResizeObserver(draw).observe(root);draw();
})();
</script>
